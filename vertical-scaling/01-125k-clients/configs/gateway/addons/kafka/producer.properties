# Required connection configs for Kafka producer, consumer, and admin
bootstrap.servers=yyyyyy.us-east-1.aws.confluent.cloud:9092
security.protocol=SASL_SSL
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='XXXXXXXXXXXX' password='XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX';
sasl.mechanism=PLAIN
# Required for correctness in Apache Kafka clients prior to 2.6
client.dns.lookup=use_all_dns_ips
 
# Best practice for higher availability in Apache Kafka clients prior to 3.0
session.timeout.ms=45000
 
# Best practice for Kafka producer to prevent data loss
acks=all
 
client.id=ccloud-java-client-57fca95e-0f41-4e10-80a3-XXXXXXXXXX

group.id=consumer-id

# Kafkorama Gateway parameter
# Set the number of producers used by the node to write messages to kafka cluster.
producers.size=1

# Kafka parameter
# By default if no partitioner class is set, all the messages published without key (key null) are sent to Kafkorama API unordered and with QoS Standard.
# To enable QoS Guaranteed and order for the messages sent with key null set parameter `partitioner.class` with value `com.migratorydata.kafka.agent.KeyPartitioner`.
# KeyPartitioner add the following restriction: all messages with key null are written by the producers to partition 0.
#partitioner.class=com.migratorydata.kafka.agent.KeyPartitioner